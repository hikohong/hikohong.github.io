# Custom GitHub Pages deployment — replaces the built-in "pages build and
# deployment" workflow, which intermittently fails its Deploy step with a
# transient 401 and cannot be re-run reliably.
#
# The site is pure static HTML/CSS/JS (no Jekyll needed), so we upload the
# repo root directly as the Pages artifact. Requires Settings → Pages →
# Source = "GitHub Actions" (configure-pages below attempts to switch it
# automatically on first run).
name: Deploy Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Browserless smoke test — syntax-check inline JS and content invariants.
  # Runs on PRs too, so regressions are caught before merge (not just at deploy).
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate web pages (inline JS + invariants)
        run: node .github/scripts/validate-web.mjs

  deploy:
    needs: validate
    # PRs validate but never deploy — only push to master / manual dispatch publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (switch source to GitHub Actions if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # The transient Pages-infra failure usually succeeds on an immediate
      # second attempt — retry once inside the same run, and keep the job
      # GREEN when the retry lands (continue-on-error + outcome check).
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Retry deploy once on failure
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
